name: Julia Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# AcceleratorLatticePlot sits on top of two moving repositories -- PALSParserJ
# binds the PALSParserCpp C structs by layout, and PALSParserCpp is what computes
# the floor coordinates the plotter draws from -- so both are checked out at
# `main` and PALSParserCpp is built from source. A change to either that
# AcceleratorLatticePlot has not followed shows up here.
#
# The suite renders through CairoMakie, which is pure software and so runs on any
# runner. GLMakie needs a real OpenGL context: Linux can supply one under xvfb
# and does, in a separate step; a headless macOS runner cannot supply one at all
# (GLMakie will not even precompile there), which is why it is not the backend
# the tests depend on.

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.11', '1.12']
        os: [macos-latest, ubuntu-latest]

    steps:
      # The three repositories side by side, the layout the README describes and
      # the one PALSParserJ searches: it looks for the shared library at
      # `<PALSParserJ>/../PALSParserCpp/build`, and AcceleratorLatticePlot
      # develops PALSParserJ at `../PALSParserJ`.
      - name: Checkout AcceleratorLatticePlot repository
        uses: actions/checkout@v5
        with:
          path: AcceleratorLatticePlot

      # Checked out as `PALSParserJ`, not `PALSParserJ.jl`: that is the directory
      # name AcceleratorLatticePlot and PALSParserJ's own library search both
      # expect.
      - name: Checkout PALSParserJ repository
        uses: actions/checkout@v5
        with:
          repository: pals-project/PALSParserJ.jl
          path: PALSParserJ

      - name: Checkout PALSParserCpp repository
        uses: actions/checkout@v5
        with:
          repository: pals-project/PALSParserCpp
          path: PALSParserCpp

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      # PALSParserCpp fetches rapidyaml (and the rest) itself via CMake
      # FetchContent, so a compiler and CMake are all it needs; both runners
      # ship CMake. The OpenGL and xvfb packages are for the GLMakie step
      # further down, which runs on Linux only.
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            xvfb xorg-dev mesa-utils libgl1 freeglut3-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      # The library and Julia must share a C++ runtime. On macOS that means
      # clang/libc++ -- the runner default, so CC/CXX are left unset rather than
      # pointed anywhere. If they ever disagree, loading a Makie backend and then
      # parsing a lattice aborts the process rather than failing a test.
      - name: Build the PALSParserCpp shared library
        working-directory: PALSParserCpp
        run: |
          cmake -S . -B build
          cmake --build build --parallel
        shell: bash

      - name: Check the C++ runtime the library links (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L PALSParserCpp/build/libPALSParserCpp.dylib
          if otool -L PALSParserCpp/build/libPALSParserCpp.dylib | grep -q libstdc++; then
            echo "::error::libPALSParserCpp links libstdc++; Julia and Makie need libc++"
            exit 1
          fi
        shell: bash

      - name: Instantiate
        working-directory: AcceleratorLatticePlot
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.develop(path="../PALSParserJ")
            Pkg.instantiate()
          '
        shell: bash

      # The whole suite, rendering through CairoMakie. No display required.
      - name: Run tests
        working-directory: AcceleratorLatticePlot
        run: julia --project=. -e 'using Pkg; Pkg.test()'
        shell: bash

      # What a user actually opens a window with. GLMakie is not a dependency of
      # the package, so it goes in a scratch environment; xvfb supplies the
      # OpenGL context. Linux only -- see the note at the top.
      - name: Smoke-test the GLMakie backend (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: AcceleratorLatticePlot
        run: |
          julia --project=/tmp/glenv -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.develop(path="../PALSParserJ")
            Pkg.add("GLMakie")
          '
          xvfb-run -a -s '-screen 0 1024x768x24' \
            julia --project=/tmp/glenv test/glmakie_smoke.jl
        shell: bash
