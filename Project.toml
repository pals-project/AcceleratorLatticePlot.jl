name = "AcceleratorLatticePlot"
uuid = "3049f814-9e03-43b8-ae7b-d1fea224693e"
authors = ["David Sagan <david.sagan@gmail.com>"]
version = "0.1.0"

# Makie, not a Makie backend. Every drawing call AcceleratorLatticePlot makes is Makie core, so
# the caller loads the backend they want -- GLMakie for an interactive window,
# CairoMakie to write a file -- and neither is a dependency of this package.
[deps]
Colors = "5ae59095-9a9b-59fe-a467-6f913c188581"
GeometryBasics = "5c1252a2-5f33-56bf-86c9-59e7332b4326"
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"
PALSParserJ = "3ffa0026-5f68-41f0-beae-2f2b11b650a3"

[compat]
julia = "1.10"

# CairoMakie is the backend the tests render through: it is pure software, so it
# works on a headless machine and on CI runners with no OpenGL, which GLMakie
# cannot even precompile on. The GLMakie path is covered by a separate CI step on
# the platform that can run it.
[extras]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "CairoMakie"]
